<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pokédex</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="star.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Selector de Juegos Personalizado -->
        <div class="selector-juego-custom" id="selector-juego">
            <div class="dropdown-trigger" id="dropdown-trigger">
                <img src="assets/icons/game-placeholder.png" alt="" class="juego-icono-img placeholder-icon">
                <span id="juego-seleccionado-nombre">Cargando...</span>
                <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
            </div>
            <div class="dropdown-options oculto" id="dropdown-options"></div>
        </div>

        <h1>Pokédex</h1>
        <div class="buscador-container">
            <input type="text" id="buscador" placeholder="Busca por nombre o número">
            <button id="buscarBtn">Buscar</button>
            <div id="sugerencias" class="sugerencias"></div>
        </div>

        <!-- SECCIÓN 1: INFO -->
        <div id="seccion-info" class="seccion-tab">
            <div id="pokemon-info">
                <h2 id="pokemon-nombre"></h2>
                <p id="pokemon-numero"></p>
                <img id="pokemon-imagen" alt="">
                
                <div id="tipos" class="categoria"></div>
                <div id="debilidades" class="categoria"></div>
                <div id="resistencias" class="categoria"></div>
                <div id="inmunes" class="categoria"></div>
                <div id="neutros" class="categoria"></div>
            </div>
        </div>

        <!-- SECCIÓN 2: EVOLUCIONES -->
        <div id="seccion-evoluciones" class="seccion-tab oculto">
            <h2>Cadena de Evolución</h2>
            <div id="contenedor-evoluciones" class="contenedor-evoluciones"></div>
        </div>

        <!-- SECCIÓN 3: CAPTURAR -->
        <div id="seccion-capturar" class="seccion-tab oculto">
            <h2>Lugares de Captura</h2>
            <div id="contenedor-capturar" class="contenedor-capturar"></div>
        </div>
    </div>

    <!-- Barra de navegación flotante inferior -->
    <nav class="menu-flotante">
        <button class="menu-item activo" data-seccion="info">
            <i class="fa-solid fa-circle-info"></i>
            <span>Info</span>
        </button>
        <button class="menu-item" data-seccion="evoluciones">
            <i class="fa-solid fa-bullseye"></i>
            <span>Evoluciones</span>
        </button>
        <button class="menu-item" data-seccion="capturar">
            <i class="fa-solid fa-location-dot"></i>
            <span>Capturar</span>
        </button>
    </nav>

    <script src="js/main.js"></script>
</body>
</html>
